services:
  - type: web
    name: influenza-wells-riley-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/v1/health"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: MIN_AIR_FLOW_M3_PER_HOUR
        value: "1.0"
      - key: MAX_EXPOSURE_HOURS
        value: "168.0"
